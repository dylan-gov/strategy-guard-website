<script>
  const logoTpl = document.getElementById('sg-logo-tpl');
  if (logoTpl) {
    document.querySelectorAll('.logo-mark').forEach(el => {
      el.appendChild(logoTpl.content.cloneNode(true));
    });
  }

  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => nav.classList.toggle('stuck', scrollY > 40), {passive:true});

  const ham = document.getElementById('hamburger');
  const mob = document.getElementById('mobileNav');
  ham.addEventListener('click', () => {
    const open = mob.classList.toggle('open');
    ham.setAttribute('aria-expanded', open);
    mob.setAttribute('aria-hidden', !open);
  });
  function closeMob(){
    mob.classList.remove('open');
    ham.setAttribute('aria-expanded', 'false');
    mob.setAttribute('aria-hidden', 'true');
  }

  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        setTimeout(() => e.target.classList.add('visible'), parseInt(e.target.dataset.delay||0));
        obs.unobserve(e.target);
      }
    });
  }, {threshold:.12});
  document.querySelectorAll('.animate-in').forEach(el => obs.observe(el));
</script>
